name: ScholarSync CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install root & server dependencies
      run: |
        npm ci || npm install
        cd server && (npm ci || npm install) && cd ..
        cd client && (npm ci || npm install) && cd ..

    - name: Run automated test suite
      run: |
        npm test

    - name: Build client production assets
      run: |
        npm run build

    - name: Verify build artifacts
      run: |
        test -d server/public || test -d client/dist

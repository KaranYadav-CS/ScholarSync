name: Deploy ScholarSync to Azure App Service

# Triggered only manually on-demand (Azure deployment is disabled during local development phase)
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies (Server & Client)
      run: |
        cd server && npm ci && cd ..
        cd client && npm ci && cd ..

    - name: Build client production assets
      run: |
        cd client && npm run build && cd ..

    - name: 'Deploy to Azure Web App'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .
